name: Update VS Marketplace stats

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch VS Marketplace download stats
        run: node scripts/fetch-vsmarketplace-downloads.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vsmarketplace-stats.json
          git diff --cached --quiet || git commit -m "Update VS Marketplace download stats"
          git push
